<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asien-Reiseplaner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#1d2a2a;--mut:#667;--line:#e2ddd2;--acc:#0f766e;--accfg:#fff;--soft:#e3f3f0;--warn:#b45309;--warnbg:#fef3c7;--r1:#b45309;--r2:#15803d;--r3:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1a;--card:#1b2626;--fg:#e8efee;--mut:#9fb0ae;--line:#2c3b3a;--acc:#2dd4bf;--accfg:#06201d;--soft:#18312f;--warn:#fbbf24;--warnbg:#3a2e0e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1a;--card:#1b2626;--fg:#e8efee;--mut:#9fb0ae;--line:#2c3b3a;--acc:#2dd4bf;--accfg:#06201d;--soft:#18312f;--warn:#fbbf24;--warnbg:#3a2e0e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:20px 0 8px}h3{margin:0;font-size:1.15rem}
nav{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--fg)}
nav button{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.mut{color:var(--mut);font-size:.9rem}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin:6px 0}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:2px}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);background:var(--bg);border-radius:8px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=number]{width:90px}
.dest{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.dest:first-of-type{border-top:0}
.dname{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rate{display:flex;gap:4px}
.rate button{padding:5px 10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-size:.85rem}
.rate button.on{color:#fff;border-color:transparent;font-weight:600}
.rate button.on.l0{background:#dc2626}.rate button.on.l1{background:var(--r1)}.rate button.on.l2{background:var(--r2)}.rate button.on.l3{background:var(--r3)}
.info{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font:italic 700 13px/1 Georgia,"Times New Roman",serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.info:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 14px;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:20;background:var(--card);color:var(--mut);border:1px solid var(--line)}
.pill:empty{display:none}.pill.ok{background:#15803d;color:#fff;border-color:#15803d}.pill.err{background:#b91c1c;color:#fff;border-color:#b91c1c}
.stop{display:grid;grid-template-columns:110px 1fr;gap:12px}
.dt{font-weight:600;font-size:.92rem}.dt small{display:block;color:var(--mut);font-weight:400}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.85rem}
.chip.me{background:var(--acc);color:var(--accfg)}
.badge{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:1px 7px;font-size:.78rem}
.go{padding:8px 14px;border:1px solid var(--acc);background:var(--soft);border-radius:8px;cursor:pointer}
.go.main{background:var(--acc);color:var(--accfg)}
.login label{margin:8px 0}.login input{width:100%}
.x{padding:7px 11px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.planmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.pl{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.num{width:22px;height:22px;border-radius:50%;color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.l1b{background:var(--r1)}.l2b{background:var(--r2)}.l3b{background:var(--r3)}
.map{height:400px;border-radius:12px;border:1px solid var(--line);position:relative;z-index:0;background:var(--soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.h{background:transparent;border:2px solid var(--mut)}
.mkw{background:none;border:0}
.mk{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px/1 system-ui,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.l1{background:#b45309}.mk.l2{background:#15803d}.mk.l3{background:#2563eb}
.mk.out{width:18px;height:18px;background:#fff;border-width:4px}
.mk.out.l1{border-color:#b45309}.mk.out.l2{border-color:#15803d}.mk.out.l3{border-color:#2563eb}
.leaflet-popup-content{font:14px/1.4 system-ui,sans-serif}
.leaflet-popup-content .go{margin-top:6px;padding:4px 10px}
dialog{width:min(680px,calc(100% - 24px));max-height:88vh;border:0;border-radius:14px;padding:0;background:var(--card);color:var(--fg);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlgin{display:flex;flex-direction:column;max-height:88vh}
.dlgh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.dlgb{padding:12px 16px 16px;overflow:auto}
.gal-main{display:block;width:100%;height:270px;object-fit:cover;border-radius:10px;background:var(--soft)}
.gal-ph{height:270px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.9rem;text-align:center;padding:12px}
.gal-th{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
.gal-th button{padding:0;border:2px solid transparent;border-radius:7px;background:none;cursor:pointer;flex:none}
.gal-th button.on{border-color:var(--acc)}
.gal-th img{display:block;width:84px;height:58px;object-fit:cover;border-radius:5px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:12px 0;font-size:.93rem}
.facts dt{color:var(--mut)}.facts dd{margin:0}
.top5{margin:6px 0 4px;padding-left:22px}.top5 li{margin:3px 0}
.btnlink{display:inline-block;text-decoration:none;color:var(--fg)}
.credit{font-size:.78rem;color:var(--mut);margin-top:12px}
.credit a,.dlgb a{color:var(--acc)}
.zform{border:2px solid var(--acc)}
.zform .row label{flex:1 1 160px}
.zform .row label.wide{flex:1 1 100%}
.zform input:not([type=number]){width:100%}
@media(max-width:820px){.planmap{grid-template-columns:1fr}.map{height:320px}}
@media(max-width:520px){.stop{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.facts dd{margin-bottom:6px}.gal-main,.gal-ph{height:200px}}
</style>
</head>

</div></dialog>

/* ---------- Planung ---------- */
function sim(order,E){
  let day=0,prev=null,bad=0;const out=[];
  order.forEach(s=>{
    let tr=0,km=0,wait=0,late=false;
    if(prev){km=Math.round(dist(byId[prev.id],byId[s.id]));tr=km<500?0:1;day+=tr}
    if(!isNaN(s.di)){if(day<=s.di){wait=s.di-day;day=s.di}else{bad+=1000;late=true}}
    out.push({...s,a:day,e:day+s.n,tr,km,wait,late});
    day+=s.n;prev=s;
  });
  bad+=Math.max(0,day-E);
  return{out,bad};
}
function compute(){
  const T=S.trip,s0=U(T.start),e0=U(T.end);
  if(isNaN(s0)||isNaN(e0)||e0<s0)return{err:'Der Reisezeitraum ist noch nicht gültig eingestellt (Ende darf nicht vor dem Start liegen). '+(S.admin?'Bitte im Admin-Bereich korrigieren.':'Der Admin muss ihn festlegen.')};
  const E=e0-s0,M=Object.keys(S.wishes),warns=[],skipped=[];
  const eff=Math.max(1,Math.min(Number(T.min)||1,M.length||1));
  const fixedRows=(T.fixed||[]).filter(f=>byId[f.d]);
  const fixedIds=new Set(fixedRows.map(f=>f.d));
  const anch=[],loose=[];
  fixedRows.forEach(f=>{
    let di=f.date?U(f.date)-s0:NaN;
    if(!isNaN(di)&&(di<0||di>E)){warns.push('Fixstopp '+byId[f.d].n+': Das Datum liegt außerhalb des Reisezeitraums und wird ignoriert.');di=NaN}
    const o={id:f.d,fix:1,di,n:Number(f.n)>0?Math.round(Number(f.n)):nts(byId[f.d])};
    (isNaN(di)?loose:anch).push(o);
  });
  anch.sort((a,b)=>a.di-b.di);
  const cands=[];
  D.forEach(d=>{
    if(fixedIds.has(d.id))return;
    const k=M.filter(m=>rt(m,d.id)>0).length,sc=M.reduce((t,m)=>t+rt(m,d.id),0);
    if(k>=eff&&k>0)cands.push({id:d.id,fix:0,di:NaN,n:nts(d),sc,k});
  });
  cands.sort((a,b)=>b.sc-a.sc||a.n-b.n);
  let order=anch;
  loose.concat(cands).forEach(c=>{
    const base=sim(order,E).bad;let best=null;
    for(let p=0;p<=order.length;p++){
      const o=order.slice(0,p).concat([c],order.slice(p));
      const bad=sim(o,E).bad,pr=order[p-1],nx=order[p];
      const cost=(pr?dist(byId[pr.id],byId[c.id]):0)+(nx?dist(byId[c.id],byId[nx.id]):0)-(pr&&nx?dist(byId[pr.id],byId[nx.id]):0);
      const ok=bad<=base,v=ok?cost:1e7+bad;
      if(!best||v<best.v)best={v,o,ok};
    }
    if(best.ok||c.fix)order=best.o;else skipped.push(c);
  });
  const fin=sim(order,E);
  const items=fin.out.map(it=>{
    const A=s0+it.a,B=s0+it.e,who=[],miss=[];
    M.forEach(m=>{
      const w=S.wishes[m],r=rt(m,it.id);if(r<=0)return;
      const f=isNaN(U(w.from))?s0:U(w.from),t=isNaN(U(w.to))?e0:U(w.to);
      (f<=A&&t>=B?who:miss).push(m);
    });
    if(it.late)warns.push('Fixstopp '+byId[it.id].n+': Anreise erst nach dem festgelegten Datum – Reihenfolge, Dauer oder Termine der Fixstopps prüfen.');
    else if(it.e>E)warns.push(byId[it.id].n+(it.fix?' (Fixstopp)':'')+' endet nach dem Reiseende.');
    return{...it,A,B,who,miss,low:who.length<eff};
  });
  return{s0,e0,E,M,eff,items,skipped,warns};
}

/* ---------- Speichern ---------- */
function saver(path,get){
  let busy=false,dirty=false;
  const f=async()=>{dirty=true;showSave('saving');if(busy)return;busy=true;let failed=false;
    while(dirty){dirty=false;try{await S.db.doc(path()).set(get());f.t=Date.now()}catch(e){failed=true;S.err='Speichern nicht möglich: '+((e&&e.code==='permission-denied')?'keine Berechtigung':((e&&e.message)||'unbekannter Fehler'))+'. Bist du angemeldet und freigeschaltet? Einstellungen darf nur der Admin ändern.';render(1)}}
    busy=false;showSave(failed?'err':'ok')};
  f.t=0;f.p=()=>busy||dirty;return f;
}
let svTimer=null;
function showSave(st){
  const el=document.getElementById('save');if(!el)return;
  clearTimeout(svTimer);
  el.className='pill '+st;
  el.textContent=st==='saving'?'Speichert …':st==='ok'?'✓ Gespeichert':'⚠ Nicht gespeichert';
  if(st==='ok')svTimer=setTimeout(()=>{el.className='pill';el.textContent=''},3000);
}

let MAP=null,mapEl=null,mLayer=null,lastSig='',lastFit='';
const RCOL={1:'#b45309',2:'#15803d',3:'#2563eb'};
function placeMap(P){
  const slot=document.getElementById('mapslot');if(!slot)return;
  if(typeof L==='undefined'){slot.innerHTML='<div class="card mut">Die Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.</div>';return}
  if(!MAP){
    mapEl=document.createElement('div');mapEl.className='map';slot.appendChild(mapEl);
    MAP=L.map(mapEl,{worldCopyJump:true});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(MAP);
    mLayer=L.layerGroup().addTo(MAP);
    MAP.setView([18,105],3);
  }else if(mapEl.parentNode!==slot)slot.appendChild(mapEl);
  requestAnimationFrame(()=>{try{MAP.invalidateSize()}catch(e){}});
  const w=my(),sel=D.filter(d=>(w.ratings||{})[d.id]>0);
  const plan=P.err?[]:P.items.filter(i=>i.who.includes(S.uid));
  const pos={};plan.forEach((i,k)=>{pos[i.id]={k:k+1,A:i.A,B:i.B}});
  const sig=JSON.stringify([sel.map(d=>[d.id,d.la,d.lo,d.n,(w.ratings||{})[d.id]]),pos]);
  if(sig!==lastSig){
    lastSig=sig;mLayer.clearLayers();
    const route=plan.map(i=>byId[i.id]).filter(Boolean).map(d=>[d.la,d.lo]);
    if(route.length>1)L.polyline(route,{color:'#0f766e',weight:3,opacity:.75,dashArray:'6 6'}).addTo(mLayer);
    sel.forEach(d=>{
      const r=Math.min(3,Math.max(1,+(w.ratings||{})[d.id]||1)),p=pos[d.id];
      const icon=L.divIcon({className:'mkw',html:'<div class="mk l'+r+(p?'':' out')+'">'+(p?p.k:'')+'</div>',iconSize:p?[26,26]:[18,18],iconAnchor:p?[13,13]:[9,9],popupAnchor:[0,-12]});
      const mk=L.marker([d.la,d.lo],{icon,title:d.n,zIndexOffset:p?1000:0,keyboard:true});
      mk.bindPopup('<b>'+esc(d.n)+'</b><br><span class="mut">'+esc(d.c)+'</span><br>Deine Bewertung: '+LV[r]+'<br>'+(p?'In deinem Plan: '+fmt(p.A)+' – '+fmt(p.B):'Nicht in deinem Plan')+'<br><button class="go" data-a="info" data-d="'+esc(d.id)+'">Infos ansehen</button>');
      mk.on('popupopen',ev=>{const el=ev.popup&&ev.popup.getElement&&ev.popup.getElement();const b=el&&el.querySelector('[data-a=info]');if(b)b.onclick=e=>{e.stopPropagation();openInfo(d.id)}});
      mk.addTo(mLayer);
    });
    const fitSig=sel.map(d=>d.id).sort().join(',');
    if(fitSig!==lastFit){
      lastFit=fitSig;
      const pts=sel.map(d=>[d.la,d.lo]);
      if(pts.length)MAP.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:7});else MAP.setView([18,105],3);
    }
  }
}

const dlg=document.getElementById('dlg');

const WIKI='https://de.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1&';
const wcache={};
const pagesOf=j=>{const p=j&&j.query&&j.query.pages;return Array.isArray(p)?p:Object.values(p||{})};
async function wget(params){const r=await fetch(WIKI+params);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function wikiPage(title){
  const j=await wget('action=query&prop=extracts|pageimages|pageprops|coordinates&exintro=1&explaintext=1&exsentences=3&piprop=thumbnail&pithumbsize=1000&ppprop=disambiguation&titles='+encodeURIComponent(title));
  const p=pagesOf(j)[0];
  if(!p||p.missing!==undefined||p.invalid!==undefined||(p.pageprops&&p.pageprops.disambiguation!==undefined))return null;
  return p;
}
async function wikiFind(d){
  for(const t of [...new Set([d.w,d.n].filter(Boolean))]){const p=await wikiPage(t);if(p)return p}
  const s=await wget('action=query&list=search&srlimit=1&srsearch='+encodeURIComponent(d.n+' '+(d.c||'')));
  const hit=s&&s.query&&s.query.search&&s.query.search[0];
  return hit?await wikiPage(hit.title):null;
}
const fname=s=>{try{return decodeURIComponent(String(s||'').split('/').pop()).replace(/^\d+px-/,'').toLowerCase()}catch(e){return ''}};
function wikiInfo(d){
  const key=[d.id,d.w,d.n].join('|');
  if(wcache[key])return wcache[key];
  const pr=(async()=>{
    const p=await wikiFind(d);if(!p)return{none:true};
    const out={title:p.title,url:'https://de.wikipedia.org/wiki/'+encodeURIComponent(p.title.replace(/ /g,'_')),text:p.extract||'',imgs:[]};
    const th=p.thumbnail&&p.thumbnail.source;
    if(th&&/\.jpe?g$/i.test(th)){const parts=String(th).split('/'),fn=th.includes('/thumb/')?parts[parts.length-2]:parts[parts.length-1];out.imgs.push({src:th,page:'https://de.wikipedia.org/wiki/Datei:'+fn,key:fname(th)})}
    try{
      const j=await wget('action=query&generator=images&gimlimit=60&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=1000&titles='+encodeURIComponent(p.title));
      const bad=/karte|map|locator|flag|flagge|wappen|coat.of.arms|logo|icon|symbol|banner|signatur|diagramm|klima|chart|panorama.*\.svg/i;
      pagesOf(j).forEach(f=>{const ii=f.imageinfo&&f.imageinfo[0];if(!ii||ii.mime!=='image/jpeg'||bad.test(f.title||'')||(ii.width&&ii.width<500))return;
        const src=ii.thumburl||ii.url,k=fname(src);if(out.imgs.some(x=>x.key===k))return;out.imgs.push({src,page:ii.descriptionurl,key:k})});
    }catch(e){}
    out.imgs=out.imgs.slice(0,5);
    return out;
  })();
  wcache[key]=pr;pr.catch(()=>{delete wcache[key]});return pr;
}

const uid36=()=>'z'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const numIn=v=>Number(String(v).trim().replace(',','.'));
function editFrom(d){return d?{id:d.id,n:d.n,c:d.c,la:String(d.la),lo:String(d.lo),nt:String(d.nt),w:d.w,ta:d.ta,t:d.t,z:d.z,top:d.top.join('\n')}:{id:null,n:'',c:'',la:'',lo:'',nt:'3',w:'',ta:'',t:'',z:'',top:''}}
function saveEdit(){
  const e=S.edit,la=numIn(e.la),lo=numIn(e.lo),nt=Math.round(numIn(e.nt));
  const errs=[];
  if(!e.n.trim())errs.push('Name fehlt');
  if(!e.c.trim())errs.push('Land fehlt');
  if(String(e.la).trim()===''||!isFinite(la)||la<-90||la>90)errs.push('Breitengrad muss zwischen -90 und 90 liegen');
  if(String(e.lo).trim()===''||!isFinite(lo)||lo<-180||lo>180)errs.push('Längengrad muss zwischen -180 und 180 liegen');
  if(!isFinite(nt)||nt<1||nt>60)errs.push('Standard-Nächte müssen zwischen 1 und 60 liegen');
  if(errs.length){S.editMsg='!'+errs.join(' · ')+'.';return false}
  const z=normZ({id:e.id||uid36(),n:e.n,c:e.c,la,lo,nt,w:e.w,ta:e.ta,t:e.t,z:e.z,top:String(e.top).split('\n')});
  const list=D.map(d=>({...d}));
  const i=list.findIndex(d=>d.id===z.id);
  if(i>=0)list[i]=z;else list.push(z);
  setZiele(list);saveZiele();S.edit=null;S.editMsg='';return true;
}
async function findCoords(){
  const e=S.edit;if(!e||!e.n.trim()){S.editMsg='!Bitte zuerst einen Namen eingeben.';render(1);return}
  S.busyFind=true;S.editMsg='';render(1);
  let msg='!Nichts gefunden. Bitte Koordinaten selbst eintragen (z. B. in Google Maps lange auf den Ort tippen und die Zahlen kopieren).';
  try{
    const p=await wikiFind({n:e.n.trim(),w:e.w.trim(),c:e.c.trim()});
    if(S.edit!==e)return;
    const co=p&&p.coordinates&&p.coordinates[0];
    if(p){if(!e.w.trim())e.w=p.title;if(!e.t.trim()&&p.extract)e.t=(p.extract.match(/^.*?[.!?](\s|$)/)||[p.extract])[0].trim().slice(0,220)}
    if(co){e.la=String(Math.round(co.lat*100)/100);e.lo=String(Math.round(co.lon*100)/100);msg='Gefunden über Wikipedia („'+p.title+'“). Bitte Koordinaten und Texte kurz prüfen.'}
    else{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q='+encodeURIComponent(e.n.trim()+(e.c.trim()?', '+e.c.trim():'')));
      const j=r.ok?await r.json():[];
      if(S.edit!==e)return;
      if(j&&j[0]){e.la=String(Math.round(Number(j[0].lat)*100)/100);e.lo=String(Math.round(Number(j[0].lon)*100)/100);msg='Koordinaten über OpenStreetMap gefunden. Bitte kurz prüfen.'}
      else if(p)msg='!Wikipedia-Artikel gefunden, aber keine Koordinaten. Bitte selbst eintragen.';
    }
  }catch(err){msg='!Suche nicht möglich (keine Verbindung). Bitte Koordinaten selbst eintragen.'}
  S.busyFind=false;if(S.edit===e)S.editMsg=msg;render(1);
}

  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'E-Mail oder Passwort ist falsch.';
  if(c.includes('email-already-in-use'))return 'Diese E-Mail ist schon registriert. Bitte „Anmelden“ wählen.';
  if(c.includes('weak-password'))return 'Das Passwort braucht mindestens 6 Zeichen.';
  if(c.includes('invalid-email'))return 'Die E-Mail-Adresse ist ungültig.';
  if(c.includes('too-many-requests'))return 'Zu viele Versuche. Bitte kurz warten.';
  if(c.includes('operation-not-allowed'))return 'E-Mail-Anmeldung ist in Firebase nicht aktiviert (siehe Anleitung, Schritt 2).';
  if(c.includes('network'))return 'Keine Internetverbindung.';
  return 'Fehler: '+(c||(e&&e.message)||'unbekannt');
}
function loadNames(){Object.entries(S.wishes).forEach(([id,w])=>{if(w&&w.name)S.names[id]=w.name});if(S.uid&&S.myName)S.names[S.uid]=S.myName}
const CONFIGURED=!!firebaseConfig&&!/HIER_EINTRAGEN|DEIN-PROJEKT/.test(JSON.stringify(firebaseConfig));
let auth=null,unsubs=[];
function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];Object.assign(S,{tab:'dash',db:null,uid:null,myName:'',ready:false,loaded:0,wishes:{},names:{},trip:{...DEF,fixed:[]},err:'',admin:false,edit:null,editMsg:''});setZiele(Z0);saveMe.t=saveTrip.t=saveZiele.t=0;lastSig='';lastFit='';if(dlg.open)dlg.close()}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-auth]');if(!b||!auth)return;
  const a=b.dataset.auth,val=id=>((document.getElementById(id)||{}).value||'');
  const msg=t=>{const m=document.getElementById('lMsg');if(m)m.textContent=t};
  try{
    if(a==='logout'){await signOut(auth);return}
    const mail=val('lMail').trim(),pw=val('lPw');
    if(a==='reset'){if(!mail){msg('Bitte zuerst deine E-Mail eingeben.');return}await sendPasswordResetEmail(auth,mail);msg('Wir haben dir eine E-Mail zum Zurücksetzen geschickt.');return}
    if(!mail||!pw){msg('Bitte E-Mail und Passwort eingeben.');return}
    if(a==='register'){
      const name=val('lName').trim();if(!name){msg('Bitte einen Namen eingeben, damit deine Freunde dich erkennen.');return}
      msg('Konto wird angelegt …');
      const c=await createUserWithEmailAndPassword(auth,mail,pw);
      await updateProfile(c.user,{displayName:name});
      if(S.uid===c.user.uid){S.myName=name;S.names[S.uid]=name;render(1)}
    }else{msg('Anmeldung läuft …');await signInWithEmailAndPassword(auth,mail,pw)}
  }catch(err){msg(authErr(err))}
});
if(!CONFIGURED){S.auth='cfg';S.err='Firebase ist noch nicht eingerichtet: Bitte die Datei config.js ausfüllen (siehe Anleitung).';render(1)}
else{
  const fb=initializeApp(firebaseConfig),fs=getFirestore(fb);auth=getAuth(fb);
  const DB={
    doc:p=>({set:d=>setDoc(doc(fs,p),d),onSnapshot:(n,er)=>onSnapshot(doc(fs,p),s=>n({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata}),er)}),
    collection:p=>({onSnapshot:(n,er)=>onSnapshot(collection(fs,p),q=>n({docs:q.docs,metadata:q.metadata}),er)})
  };
  const perm=e=>(e&&e.code==='permission-denied')?'Keine Berechtigung. Sind die aktuellen Regeln aus firestore.rules in Firebase veröffentlicht und ist deine E-Mail freigeschaltet?':((e&&e.message)||'');
  S.auth='wait';render(1);
  onAuthStateChanged(auth,u=>{
    stopAll();
    if(!u){S.auth='out';render(1);return}
    S.auth='in';S.db=DB;S.uid=u.uid;S.myName=u.displayName||(u.email||'').split('@')[0];S.names[u.uid]=S.myName;
    const got=()=>{if(++S.loaded>=3&&!S.ready){S.ready=true;render(1)}};
    const fresh=x=>!(x&&x.metadata&&x.metadata.fromCache);
    const tm=setTimeout(()=>{if(!S.ready&&S.uid===u.uid){S.ready=true;S.err='Die Verbindung ist langsam – Daten sind eventuell noch nicht vollständig geladen.';render(1)}},8000);
    unsubs.push(()=>clearTimeout(tm));
    render(1);
    unsubs.push(DB.doc('trip/main').onSnapshot(s=>{
      if(S.ready&&(saveTrip.p()||Date.now()-saveTrip.t<6000))return;
      if(s.exists){const d=clone(s.data()||{});S.trip=Object.assign({},DEF,d,{fixed:Array.isArray(d.fixed)?d.fixed.map(f=>({...f})):[]})}
      if(fresh(s)&&!S.ready)got();
      render();
    },e=>{S.err='Reisedaten konnten nicht geladen werden: '+perm(e);got();render(1)}));
    unsubs.push(DB.doc('trip/ziele').onSnapshot(s=>{
      if(S.ready&&(saveZiele.p()||Date.now()-saveZiele.t<6000))return;
      const d=s.exists?clone(s.data()||{}):null;
      if(d&&Array.isArray(d.liste))setZiele(d.liste);else if(!s.exists)setZiele(Z0);
      if(fresh(s)&&!S.ready)got();
      render();
    },e=>{S.err='Zielliste konnte nicht geladen werden: '+perm(e);setZiele(Z0);got();render(1)}));
    unsubs.push(DB.collection('wishes').onSnapshot(q=>{
      const w={};q.docs.forEach(d=>{w[d.id]=clone(d.data()||{})});
      if(S.ready&&S.wishes[S.uid])w[S.uid]=S.wishes[S.uid];
      S.wishes=w;loadNames();if(fresh(q)&&!S.ready)got();
      render();
    },e=>{S.err='Wünsche konnten nicht geladen werden: '+perm(e);got();render(1)}));
    unsubs.push(DB.doc('admincheck/ping').onSnapshot(()=>{if(!S.admin){S.admin=true;render()}},()=>{if(S.admin){S.admin=false}S.edit=null;render()}));
  });
}
